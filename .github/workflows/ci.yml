name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Unit tests and fixture invariant checks
        run: pytest -q
      - name: Report generator runs on committed trial records
        run: |
          if [ -f results/trials.jsonl ]; then
            PYTHONPATH=src python -m airrel.report results /tmp/RESULTS.md
          fi
